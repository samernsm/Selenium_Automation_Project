name: Selenium Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chrome
          - firefox

    env:
      BROWSER: ${{ matrix.browser }}
      HEADLESS: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Selenium tests
        run: |
          pytest -v \
            --html=reports/${{ matrix.browser }}-report.html \
            --self-contained-html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selenium-test-report-${{ matrix.browser }}
          path: reports/${{ matrix.browser }}-report.html
          if-no-files-found: warn

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: selenium-failure-screenshots-${{ matrix.browser }}
          path: screenshots/
          if-no-files-found: warn
